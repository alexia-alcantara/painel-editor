# Arquivo: azure-pipelines.yml

trigger:
- main  

pool:
  vmImage: 'ubuntu-latest' # Linux é o padrão e mais rápido

steps:

- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js 20.x'

- script: |
    npm install
  displayName: 'npm install'

- script: |
    npm run test -- --no-watch --no-progress --browsers=ChromeHeadless
  displayName: 'Run Unit Tests (ng test)'

- script: |
    npm run build -- --configuration=production
  displayName: 'Build Angular App (ng build)'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'dist/painel-angular' # <-- Mude isso!
    ArtifactName: 'drop'
    publishLocation: 'Container'