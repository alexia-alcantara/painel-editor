@if(parlamentar) {

<div class="flex items-stretch w-full min-h-full text-white rounded overflow-hidden transition-opacity duration-300"
     [class.bg-slate-700]="mostrarFundo"
     [class.opacity-50]="ausente && !parlamentar.corNome">

  <div class="flex-1 min-w-0 px-4 py-2 flex items-center font-medium"
       [style.border-right]="mostrarFundo ? '4px solid #18262D' : 'none'"
       [ngStyle]="{
        'font-family': fontNome?.family,
        'font-size.px': fontNome?.size,
        'font-weight': fontNome?.weight,
        'font-style': fontNome?.style,
        'color': corNome
      }">
    <span class="truncate leading-[1.35]">{{ parlamentar.nome }}</span>
  </div>

  <div class="w-[25%] flex-shrink-0 px-1 py-2 flex items-center justify-center"
       style="container-type: inline-size"
       [style.border-right]="mostrarFundo ? '4px solid #18262D' : 'none'"
       [ngStyle]="{
        'font-family': fontPartido?.family,
        'font-size.px': fontPartido?.size,
        'font-weight': fontPartido?.weight,
        'font-style': fontPartido?.style,
        'color': corPartido
      }">
    <span class="truncate leading-[1.35]" [style.font-size]="tamanhoPartido">{{ parlamentar.partido || 'PARTIDO' }}</span>
  </div>

  <div class="w-[8%] flex-shrink-0 px-1 py-2 flex items-center justify-center font-bold"
       [ngStyle]="{
        'font-family': fontVoto?.family,
        'font-size.px': fontVoto?.size,
        'font-weight': fontVoto?.weight,
        'font-style': fontVoto?.style
      }">
    <span class="truncate leading-[1.35]" [style.color]="corLetra">{{ letra }}</span>
  </div>

</div>

}
