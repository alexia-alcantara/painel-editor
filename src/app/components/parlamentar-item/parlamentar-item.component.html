<div class="flex w-full bg-slate-700 text-white text-sm rounded overflow-hidden">
  <div class="flex-1 px-4 py-2 border-r-4 border-[#18262D] truncate font-medium">
    {{ parlamentar.nome }}
  </div>

  <div class="w-28 px-2 py-2 border-r-4 border-[#18262D] text-center text-slate-300">
    {{ parlamentar.partido || 'PARTIDO' }}
  </div>

  <div
    class="w-10 px-2 py-2 text-center font-bold"
    [ngClass]="{
      'text-green-400': parlamentar.voto === 'S',
      'text-red-400': parlamentar.voto === 'N',
      'text-gray-400': !parlamentar.voto || parlamentar.voto === '-'
    }"
  >
    {{ parlamentar.voto || '-' }}
  </div>
</div>
