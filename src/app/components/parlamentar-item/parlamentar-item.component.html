@if(parlamentar) {

<div class="flex items-stretch w-full min-h-full bg-slate-700 text-white rounded overflow-hidden transition-opacity duration-300"
     [class.opacity-50]="(parlamentar.presenca ?? parlamentar.status) === 'AUSENTE'">

  <div class="flex-1 min-w-0 px-4 py-2 border-r-4 border-[#18262D] flex items-center font-medium"
       style="container-type: inline-size"
       [ngStyle]="{
        'font-family': fontNome?.family,
        'font-size.px': fontNome?.size,
        'font-weight': fontNome?.weight,
        'font-style': fontNome?.style,
        'color': parlamentar.cor || fontNome?.color
      }">
    <span class="truncate leading-[1.35]" [style.font-size]="tamanhoNome">{{ parlamentar.nome }}</span>
  </div>

  <div class="w-[25%] flex-shrink-0 px-1 py-2 border-r-4 border-[#18262D] flex items-center justify-center text-slate-300"
       style="container-type: inline-size"
       [ngStyle]="{
        'font-family': fontPartido?.family,
        'font-size.px': fontPartido?.size,
        'font-weight': fontPartido?.weight,
        'font-style': fontPartido?.style,
        'color': fontPartido?.color
      }">
    <span class="truncate leading-[1.35]" [style.font-size]="tamanhoPartido">{{ parlamentar.partido || 'PARTIDO' }}</span>
  </div>

  <div class="w-[8%] flex-shrink-0 px-1 py-2 flex items-center justify-center font-bold"
       [ngStyle]="{
        'font-family': fontVoto?.family,
        'font-size.px': fontVoto?.size,
        'font-weight': fontVoto?.weight,
        'font-style': fontVoto?.style
      }">
    <span class="truncate leading-[1.35]" [style.color]="parlamentar.cor">
        {{ parlamentar.status }}
    </span>
  </div>

</div>

}
