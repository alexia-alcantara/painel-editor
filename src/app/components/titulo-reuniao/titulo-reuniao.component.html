<div class="w-full h-full flex items-center" [style.justify-content]="justificar" [style.text-align]="fontConfig?.align || 'center'">
   <h3 class="m-0 leading-tight text-white" [ngStyle]="{
     'font-family': fontConfig?.family || 'Inter, sans-serif',
     'font-size.px': fontConfig?.size || 24,
     'color': fontConfig?.color || '#FFFFFF',
     'font-weight': fontConfig?.weight || 'bold',
     'font-style': fontConfig?.style || 'normal'
   }">
     {{ dados?.texto || 'Carregando Título...' }}
   </h3>
</div>
