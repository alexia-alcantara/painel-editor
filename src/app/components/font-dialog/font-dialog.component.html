<div class="font-dialog p-4 w-[420px] rounded-xl shadow-xl bg-white text-gray-800">
  <h2 class="text-lg font-semibold mb-4 border-b pb-2">Fonte</h2>

  <div class="grid grid-cols-3 gap-4">
    <div class="flex flex-col">
      <label class="text-xs mb-1">Fonte:</label>
      <select [(ngModel)]="selectedFont" size="6" class="border rounded p-1 h-32 focus:ring-2 focus:ring-blue-500">
        @for (font of fonts; track font) {
          <option [value]="font.value" [ngStyle]="{ 'font-family': font.value }">{{ font.name }}</option>
        }
      </select>
    </div>

    <div class="flex flex-col">
      <label class="text-xs mb-1">Estilo da fonte:</label>
      <select [(ngModel)]="selectedStyle" size="6" class="border rounded p-1 h-32 focus:ring-2 focus:ring-blue-500">
        @for (estilo of styles; track estilo.nome) {
          <option [value]="estilo.nome" [ngStyle]="{
            'font-weight': estilo.weight,
            'font-style': estilo.style
          }">
            {{ estilo.nome }}
          </option>
        }
      </select>
    </div>

    <div class="flex flex-col">
      <label class="text-xs mb-1">Tamanho:</label>
      <input type="number" min="6" max="400" step="1" [(ngModel)]="selectedSize"
        class="border rounded p-1 mb-1 w-full focus:ring-2 focus:ring-blue-500"
        title="Digite o tamanho ou escolha na lista">
      <select [(ngModel)]="selectedSize" size="5" class="border rounded p-1 h-28 focus:ring-2 focus:ring-blue-500">
        @for (size of sizes; track size) {
          <option [ngValue]="size">{{ size }}</option>
        }
      </select>
    </div>
  </div>

  <div class="mt-4">
    <label class="text-xs block mb-1">Alinhamento:</label>
    <div class="flex gap-2">
      @for (a of alinhamentos; track a.valor) {
        <button type="button" (click)="selectedAlign = a.valor" [title]="a.nome"
          class="flex-1 border rounded py-1 flex items-center justify-center gap-2 text-sm"
          [class.bg-blue-600]="selectedAlign === a.valor"
          [class.text-white]="selectedAlign === a.valor"
          [class.border-blue-600]="selectedAlign === a.valor">
          <i class="fa-solid" [ngClass]="a.icone"></i> {{ a.nome }}
        </button>
      }
    </div>
  </div>

  <div class="mt-4">
    <label class="text-xs block mb-1">Exemplo</label>
    <div class="border p-3 text-center rounded-md bg-gray-100"
      [ngStyle]="{
        'font-family': selectedFont,
        'font-size.px': selectedSize,
        'font-weight': estiloSelecionado.weight,
        'font-style': estiloSelecionado.style,
        'color': '#000000',
        'text-align': selectedAlign
      }">
      <span>AaBbYyZz</span>
    </div>
  </div>

  <div class="flex justify-end gap-2 mt-6">
    <button mat-button (click)="dialogRef.close()">Cancelar</button>
    <button mat-flat-button color="primary" (click)="close()">OK</button>
  </div>
</div>
