<div class="flex gap-2">
  @for (t of temporizadores; track t) {
    <div
      class="bg-gray-600 rounded-md px-4 py-1 text-white text-sm font-semibold flex items-center gap-1 w-fit"
    >
      @if (t.icon) {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-4 h-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
      }
      {{ t.tempo }}
    </div>
  }
</div>
