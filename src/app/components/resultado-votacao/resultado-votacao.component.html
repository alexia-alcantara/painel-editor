<div class="resultado-texto w-full h-full flex items-center leading-tight"
  [style.justify-content]="justificar" [style.text-align]="fontConfig.align || 'center'"
  [ngStyle]="{
    'font-family': fontConfig.family,
    'font-size.px': fontConfig.size,
    'font-weight': fontConfig.weight,
    'font-style': fontConfig.style,
    'color': fontConfig.color
  }">
  {{ dados?.texto }}
</div>
