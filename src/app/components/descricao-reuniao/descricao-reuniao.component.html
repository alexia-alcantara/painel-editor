<div class="descricao-container w-full h-full flex items-start justify-center text-center">
  <p class="text-white leading-snug" [ngStyle]="{
    'font-family': fontConfig?.family,
    'font-size.px': fontConfig?.size,
    'font-weight': fontConfig?.weight,
    'font-style': fontConfig?.style,
    'color': fontConfig?.color || '#FFFFFF'
  }">
    {{ dados?.texto || 'Carregando descrição' }}
  </p>
</div>
