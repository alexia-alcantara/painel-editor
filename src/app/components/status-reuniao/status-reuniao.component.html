<div
  class="bg-gray-600 w-auto rounded-lg px-4 py-2 text-white text-sm leading-tight font-inter"
  [style.height.px]="height"
>
  <div class="flex justify-between">
    <span class="font-semibold">PRESENTES</span>
    <span>{{ presentes }}</span>
  </div>
  <div class="flex justify-between mt-1">
    <span class="font-semibold">VOTOS</span>
    <span>{{ votos }}</span>
  </div>
  <div class="flex justify-center mt-1">
    <span class="font-semibold">{{ andamento }}</span>
  </div>
</div>
