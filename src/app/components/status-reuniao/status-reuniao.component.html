<div
  class="bg-gray-600 w-auto rounded-lg px-4 py-4 text-white text-sm leading-tight font-inter "
  [style.height.px]="height" [style.width.px]="width"
>
  <div class="flex justify-between items-center">
    <span class="font-semibold mb-2 text-lg">PRESENTES</span>
    <span class="text-lg font-semibold">{{ presentes }}</span>
  </div>
  <div class="flex justify-between items-center mt-1">
    <span class="font-semibold mb-2 text-lg">VOTOS</span>
    <span class="text-lg font-semibold">{{ votos }}</span>
  </div>
  <div class="flex justify-center mt-1">
    <span class="font-semibold">{{ andamento }}</span>
  </div>
</div>
