<div 
  class="flex justify-between items-center status-item w-full" 
  [style.height.px]="height"
  [style.color]="props?.cor || 'white'"> 

    <span [ngStyle]="labelStyle()" class="font-semibold uppercase text-lg">{{ label }}</span>
    
    <span [ngStyle]="valorStyle()" class="font-semibold text-lg">{{ valor | number:'2.0' }}</span>
    
</div>
