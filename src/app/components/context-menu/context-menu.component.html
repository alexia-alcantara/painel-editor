<div #menuRef class="context-menu glass" [class.hidden]="!visible" [style.left.px]="x" [style.top.px]="y"
  [style.opacity]="opacity" (contextmenu)="$event.preventDefault()">

  @if (visible) {
  @if (activeComponent && activeComponent.tipo === 'parlamentar') {
  <div class="menu-item" (click)="abrirModalDistribuicao()">
    <i class="fa-solid fa-table-cells"></i>
    <span>Distribuir Parlamentares</span>
  </div>
  <hr class="divider">
  }
  <!-- ITENS DINÂMICOS DO SERVIÇO -->
  @for (grupo of grupos; track grupo.tipo) {
  <div class="menu-item group relative">
    <span>{{ grupo.label }}</span>
    <i class="fa-solid fa-chevron-right ml-auto opacity-60"></i>

    <!-- SUBMENU -->
    <div class="submenu absolute top-0 left-full z-50 hidden group-hover:flex flex-col 
                    bg-black/90 text-white rounded-md shadow-lg">
      @for (sub of grupo.subItens; track sub.subId) {
      <button (click)="openFontDialog(grupo.tipo, sub.subId)" class="px-4 py-2 hover:bg-white/10 text-left">
        {{ sub.label }}
      </button>
      }
    </div>
  </div>
  }

  <hr class="divider">

  @if (isEditorMode) {
  <div class="menu-item" (click)="abrirModalConfiguracaoTela()">
    <i class="fa-solid fa-gear"></i>
    <span>Configurar Tela</span>
  </div>
  }
  }
</div>
