<div class="editor-wrapper relative w-full min-h-screen bg-[#18262D] overflow-y-auto">
  @for (item of componentes(); track item.id) {
  @if (item) {
  <ng-container>
    <div class="componente-box absolute rounded cursor-grab "
    cdkDrag
     [cdkDragFreeDragPosition]="{ x: item.x, y: item.y }"
     (cdkDragEnded)="onDragEnd($event, item)"
     [style.width.px]="item.width"
     [style.height.px]="item.height"
      cdkDragBoundary=".editor-wrapper">
      @switch(item.tipo) {
      @case('parlamentar') {
      <app-parlamentar-item [parlamentar]="item.dados"></app-parlamentar-item>
      }
      @case('totalizadores') {
      <app-votacao-total [dados]="item.dados"></app-votacao-total>
      }
      @case('imagem') {
      <app-imagem-reuniao></app-imagem-reuniao>
      }
      @case('cabecalho') {
      <app-header-reuniao></app-header-reuniao>
      }
      @case('status-reuniao') {
      <app-status-reuniao [presentes]="26" [votos]="21"></app-status-reuniao>
      }
      @case('temporizador-item') {
      <app-temporizador-item [tempo]="item.props?.tempo ?? '00:00'"
        [icon]="item.props?.icon ?? false"></app-temporizador-item>
      }

      @default {
        
      }
      }
    </div>
  </ng-container>
  }
  }

  <button (click)="salvar()" class="text-white absolute bottom-4 left-4">Salvar Layout</button>
</div>
