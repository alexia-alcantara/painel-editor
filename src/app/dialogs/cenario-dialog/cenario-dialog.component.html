<div class="bg-gray-800 text-white rounded-lg">

  <h1 mat-dialog-title class="text-xl font-bold">Gerenciar Cenários</h1>

  <div mat-dialog-content class="min-w-[500px] max-h-[60vh] overflow-y-auto p-2">
    
    @if (cenarios.length > 0) {
      <ul class="space-y-2">
        @for (cenario of cenarios; track cenario.id) {
          <li class="flex items-center justify-between p-2 bg-gray-700 rounded transition-colors hover:bg-gray-600">
            
            <span class="font-medium">{{ cenario.nome }}</span>
            
            <div class="flex items-center gap-2">
              <button (click)="carregarCenario(cenario.id)" mat-button color="primary">Carregar</button>
              
              <button (click)="removerCenario(cenario.id, cenario.nome)" mat-button color="warn">Deletar</button>
            </div>

          </li>
        }
      </ul>
    } @else {
      <p class="text-center text-gray-400 my-8">Nenhum cenário salvo.</p>
    }
  </div>

  <hr class="my-2 border-gray-600">

  <div mat-dialog-actions class="flex justify-between items-center p-2">
    <div class="flex gap-2">
      <button (click)="exportarLayout()" mat-stroked-button>Exportar Layout Atual</button>
      
      <input type="file" hidden #fileInput (change)="importarLayout($event)" accept=".json">
      <button (click)="fileInput.click()" mat-stroked-button>Importar de Arquivo</button>
    </div>
    
    <button mat-flat-button color="primary" [mat-dialog-close]>Fechar</button>
  </div>

</div>
